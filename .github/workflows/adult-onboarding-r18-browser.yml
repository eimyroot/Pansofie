name: Adult Onboarding R18 Browser Proof

on:
  pull_request:
    paths:
      - "src/pages/Onboarding.jsx"
      - "src/components/pansofie/LegacyOnboardingR14.jsx"
      - "src/lib/AuthContext.jsx"
      - "src/lib/pansofieOnboardingFlow.js"
      - "src/adult-onboarding-r18.css"
      - "supabase/migrations/20260824032000_adult_onboarding_r18.sql"
      - "scripts/check-adult-onboarding-r18.mjs"
      - "tests/e2e/adult-onboarding-r18.spec.mjs"
      - "src/pages/Register.jsx"
      - "package.json"
      - ".github/workflows/adult-onboarding-r18-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adult-onboarding-r18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANSOFIE_LOCAL_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Run R18 static contract
        run: npm run check:adult-onboarding-r18

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium

      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pansofie-r18.log 2>&1 &
          echo $! > /tmp/pansofie-r18.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "LOCAL_VITE=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pansofie-r18.log
          exit 1

      - name: Run R18 browser acceptance
        run: npx playwright test tests/e2e/adult-onboarding-r18.spec.mjs --reporter=line

      - name: Upload R18 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pansofie-adult-onboarding-r18-browser-evidence
          path: |
            browser-evidence/adult-onboarding-r18/
            test-results/
            /tmp/pansofie-r18.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Vite server
        if: always()
        run: |
          if [ -f /tmp/pansofie-r18.pid ]; then kill "$(cat /tmp/pansofie-r18.pid)" || true; fi
