name: Public Copy R8 Browser Proof

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/public-copy-r8.spec.mjs"
      - ".github/workflows/public-copy-r8-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-copy-r8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PANSOFIE_LOCAL_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium

      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pansofie-public-copy-r8.log 2>&1 &
          echo $! > /tmp/pansofie-public-copy-r8.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "LOCAL_VITE=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pansofie-public-copy-r8.log
          exit 1

      - name: Run R8 public copy and dramaturgical browser acceptance
        run: npx playwright test tests/e2e/public-copy-r8.spec.mjs --reporter=line

      - name: Upload R8 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pansofie-public-copy-r8-browser-evidence
          path: |
            browser-evidence/public-copy-r8/
            test-results/
            /tmp/pansofie-public-copy-r8.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Vite server
        if: always()
        run: |
          if [ -f /tmp/pansofie-public-copy-r8.pid ]; then kill "$(cat /tmp/pansofie-public-copy-r8.pid)" || true; fi
