name: Staging Pilot Acceptance

on:
  pull_request:
    paths:
      - "tests/e2e/**"
      - ".github/workflows/staging-pilot-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-pilot-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PANSOFIE_STAGING_URL: https://pansofie-staging.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging Pilot R1 acceptance
        run: npx playwright test tests/e2e/pilot-staging.spec.mjs --reporter=line

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-pilot-acceptance-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
