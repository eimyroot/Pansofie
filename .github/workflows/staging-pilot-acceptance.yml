name: Staging Public Product Acceptance

on:
  push:
    branches:
      - main
    paths:
      - "tests/e2e/**"
      - "src/**"
      - ".github/workflows/staging-pilot-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-public-product-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANSOFIE_STAGING_URL: https://pansofie-staging.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow canonical staging alias to settle
        run: sleep 30

      - name: Run public product browser acceptance
        run: npx playwright test tests/e2e/pilot-staging.spec.mjs tests/e2e/public-completion.spec.mjs tests/e2e/partner-challenge-r4.spec.mjs --reporter=line --retries=1

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pansofie-public-web-completion-r1-browser-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
