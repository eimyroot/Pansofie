name: Navigation Contract R23 Browser Proof

on:
  pull_request:
    paths:
      - "src/App.jsx"
      - "src/pages/Login.jsx"
      - "src/pages/Register.jsx"
      - "src/pages/PansofieGo.jsx"
      - "src/pages/MaterialBridge.jsx"
      - "src/pages/WitnessVerification.jsx"
      - "docs/canonical/PANSOFIE_NAVIGATION_CONTRACT_V1.0.md"
      - "scripts/check-navigation-contract-r23.mjs"
      - "tests/e2e/navigation-contract-r23.spec.mjs"
      - "package.json"
      - ".github/workflows/navigation-contract-r23-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-contract-r23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANSOFIE_LOCAL_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Run R23 static contract
        run: npm run check:navigation-contract-r23

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium

      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pansofie-r23.log 2>&1 &
          echo $! > /tmp/pansofie-r23.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "LOCAL_VITE=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pansofie-r23.log
          exit 1

      - name: Run R23 browser acceptance
        run: npx playwright test tests/e2e/navigation-contract-r23.spec.mjs --reporter=line

      - name: Upload R23 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pansofie-navigation-contract-r23-browser-evidence
          path: |
            test-results/
            /tmp/pansofie-r23.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Vite server
        if: always()
        run: |
          if [ -f /tmp/pansofie-r23.pid ]; then kill "$(cat /tmp/pansofie-r23.pid)" || true; fi
